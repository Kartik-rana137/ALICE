# ALICE hardware/config file. Copy to alice.toml (not committed) and edit for your machine.
# Everything is optional: missing values fall back to the defaults in src/alice/config.py,
# target a constrained local GPU setup.

[server]
binary = "tools/llama.cpp/llama-server"   # ".exe" is added automatically on Windows
host = "127.0.0.1"
port = 8088
prompt_cache = true                       # save the processed fixed prompt (~19 s of work) and restore it at startup
prompt_cache_dir = "data/prompt_cache"    # ~250 MB per file, newest 2 kept

[paths]
models = "models"
logs = "logs"

[chat]
profile = "default"            # which [models.*] entry `alice` uses unless --model is given

# The built-in "default" profile is Qwen3.5-9B Q4_K_M at 16k context on a constrained GPU.
# Add or override profiles here. Keys: gguf (required), ctx, ngl, n_cpu_moe, max_tokens,
# thinking_max_tokens, reasoning_budget, extra_args, note, logit_bias, sampling, thinking_sampling,
# chat_template (a .jinja file; the default profile uses templates/qwen3.5-stable-history.jinja so the
# prompt cache works across turns - leave it out for other model families).

# Example for a larger GPU setup:
# [models.big]
# gguf = "Qwen3.8-27B-Q4_K_M.gguf"
# ctx = 32768
# ngl = 99
# extra_args = ["-fa", "on"]
# note = "27B dense, all in GPU memory"

# Example: a MoE model with experts partially offloaded to system RAM:
# [models.moe]
# gguf = "Qwen3.6-35B-A3B-UD-IQ4_XS.gguf"
# n_cpu_moe = 36
# note = "MoE, experts partially on CPU"

[embedding]
gguf = "Qwen3-Embedding-0.6B-Q8_0.gguf"
port = 8091
device = "cpu"                 # "gpu" once there is VRAM to spare next to the chat model
# Thresholds are specific to the embedding model: after changing `gguf`, run
#   alice library --rebuild   and   python scripts/calibrate_retrieval.py
retrieve_min_sim = 0.65
retrieve_min_sim_explicit = 0.50

[arxiv]
# When a question names a paper or method that isn't in your library, search arXiv for that name
# before answering. Off by default because it sends the name (not your whole question) to arxiv.org.
# Toggle per session with --auto-arxiv or /arxiv auto on|off.
auto_lookup = false

[library]
dir = "data/library"
prefetch_k = 5                 # passages inserted per question (more = better recall, slower prompts)

[memory]
# Long-term memory: notes about you kept between sessions, on this computer only (/memory, /forget).
enabled = true
dir = "data/memory"
save_on_exit = true            # summarise the conversation when the chat closes (a few seconds)
prompt_facts = 25              # newest notes put in the system prompt at startup
prompt_sessions = 3            # newest conversation summaries put in the system prompt
compact_at = 0.75              # compact the oldest turns when the conversation fills this share of the context
keep_turns = 2                 # newest turns always kept word for word

[claude]
# Escalation to Claude for questions the local model is too weak for. Off by default. Needs
# pip install -e ".[claude]" and ANTHROPIC_API_KEY. ALICE always shows what would be sent and asks first.
enabled = false
model = "claude-opus-5-5"
effort = "high"                # low | medium | high | xhigh | max
max_tokens = 16000
monthly_budget_usd = 5.0       # enforced from logs/claude_usage.jsonl
context_turns = 4              # earlier turns sent along with the question
suggest = true                 # offer /claude when a local answer fails a check
