[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alice"
version = "0.1.0"
description = "Local AI mentor for CS/AI coding, study and research"
requires-python = ">=3.11"          # tomllib
dependencies = [
    "pypdf>=5",         # paper library: PDF text
    "numpy>=1.26",      # paper library: vector search
    "textual>=8.2",     # chat box UI (alice tui)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
claude = ["anthropic>=2.10"]   # optional escalation to Claude (/claude)
gui = ["starlette>=1.0", "uvicorn>=0.30", "websockets>=13", "python-multipart>=0.0.9", "pywebview>=5"]   # alice gui

[project.scripts]
alice = "alice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"alice.gui" = ["static/*", "static/vendor/*", "static/vendor/*/*", "static/vendor/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
