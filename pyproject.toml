[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alice"
version = "0.1.0"
description = "Local AI mentor for CS/AI coding, study and research"
requires-python = ">=3.10"
dependencies = []          # stdlib only for now (llama-server is driven over HTTP)

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
alice = "alice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
